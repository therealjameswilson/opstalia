name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
    inputs:
      deployment_confirmation:
        description: Type DEPLOY_OPSTALIA_BACKEND after reviewing Worker adapter and secret readiness
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production Worker
    if: ${{ inputs.deployment_confirmation == 'DEPLOY_OPSTALIA_BACKEND' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Validate deployment credentials are present
        shell: bash
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::error::Cloudflare deployment credentials are not configured."
            exit 1
          fi
          echo "Cloudflare deployment credentials are configured."
          echo "This workflow does not read, print, or replace NARA_API_KEY, GOVINFO_API_KEY, or RATE_LIMIT_SALT."

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check Worker
        run: npm run typecheck

      - name: Run Worker integration and security tests
        run: |
          npm run test:integration
          npm run test:security

      - name: Deploy Worker
        run: npx wrangler deploy --config worker/wrangler.toml
